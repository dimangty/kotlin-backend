# Памяти достаточно для Kotlin-компилятора и упаковки desktop-приложения.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Официальный стиль Kotlin делает форматирование предсказуемым.
kotlin.code.style=official
# Параллельная конфигурация ускоряет повторные локальные сборки.
org.gradle.parallel=true
