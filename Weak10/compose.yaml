services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PG_PORT:-5438}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses"]
      interval: 2s
      timeout: 2s
      retries: 20
