spring:
  application:
    name: course-catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/courses}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
