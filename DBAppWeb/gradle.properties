# Памяти достаточно для Kotlin/Wasm linker и Compose compiler.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Compose/Wasm test linker обрабатывает весь UI и нуждается в отдельном увеличенном heap компилятора.
kotlin.daemon.jvmargs=-Xmx5g
# Официальный стиль Kotlin применяется ко всем исходникам клиента.
kotlin.code.style=official
# Кеширование конфигурации ускоряет повторные сборки учебного приложения.
org.gradle.configuration-cache=true
